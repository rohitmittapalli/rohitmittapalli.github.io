<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Rohit Mittapalli</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fef7f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1410" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/favicon.ico">
    <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Geist Mono';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/geist-mono-latin.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Instrument Serif';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url('/fonts/instrument-serif-latin.woff2') format('woff2');
        }

        :root {
            --bg: #fef7f0;
            --text: #3d2c1e;
            --text-secondary: #8b7355;
            --accent: #c2410c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1410;
                --text: #f0e6da;
                --text-secondary: #a8927c;
                --accent: #f97316;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: 17px; }

        body {
            font-family: 'Geist Mono', ui-monospace, monospace;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 24px;
        }

        .code {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 6rem;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--accent);
        }

        p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 16px 0 24px;
        }

        a {
            font-size: 0.85rem;
            color: var(--text);
            text-decoration: none;
            background: linear-gradient(var(--accent), var(--accent)) no-repeat right bottom / 0 1px;
            transition: background-size 0.3s ease;
            padding-bottom: 2px;
        }

        a:hover {
            background-size: 100% 1px;
            background-position: left bottom;
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 2px;
        }

        ::selection { background: var(--accent); color: var(--bg); }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <p>This page took a wrong turn on final approach.</p>
        <a href="/">← Back home</a>
    </main>
</body>
</html>
